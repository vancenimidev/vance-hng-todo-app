<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Focus &amp; Flow — Calm, AI-assisted to-dos</title>
    <meta name="description" content="Focus & Flow is a sleek, dark-mode to-do app with priorities, search, and AI micro-task breakdowns that turn big tasks into three actionable steps." />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark" />
    <meta property="og:title" content="Focus & Flow" />
    <meta property="og:description" content="Calm, AI-assisted to-dos. Break big tasks into bite-sized steps." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="./src/js/tailwind.config.js"></script>
    <link rel="stylesheet" href="./src/css/styles.css" />
    <script type="module" src="./src/js/app.js"></script>
  </head>

  <body class="min-h-full bg-zinc-950 font-sans text-zinc-100 antialiased">
    <a href="#task-input" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-lg focus:bg-violet-600 focus:px-4 focus:py-2 focus:text-sm focus:font-semibold">Skip to new task</a>

    <!-- Ambient backdrop -->
    <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" aria-hidden="true">
      <div class="aurora -left-32 -top-40 h-[28rem] w-[28rem] bg-violet-600"></div>
      <div class="aurora -right-40 top-20 h-[26rem] w-[26rem] bg-cyan-500" style="animation-delay: -7s"></div>
      <div class="aurora bottom-[-12rem] left-1/3 h-[24rem] w-[24rem] bg-fuchsia-600" style="animation-delay: -14s; opacity: 0.18"></div>
      <div class="grid-overlay absolute inset-0"></div>
    </div>

    <div class="mx-auto flex min-h-screen w-full max-w-2xl flex-col px-4 pb-24 pt-10 sm:px-6 sm:pt-16">
      <!-- Header -->
      <header class="flex items-start justify-between gap-6">
        <div>
          <p id="today" class="text-xs font-medium uppercase tracking-[0.2em] text-zinc-500"></p>
          <h1 class="mt-2 font-display text-4xl font-bold tracking-tight sm:text-5xl">
            <span class="text-gradient">Focus</span> <span class="text-zinc-500">&amp;</span> <span class="text-zinc-50">Flow</span>
          </h1>
          <p id="progress-caption" class="mt-2 text-sm text-zinc-400">Loading your tasks…</p>
        </div>

        <div class="relative grid h-16 w-16 shrink-0 place-items-center sm:h-20 sm:w-20" role="img" aria-label="Completion progress">
          <svg class="h-full w-full -rotate-90" viewBox="0 0 60 60" aria-hidden="true">
            <defs>
              <linearGradient id="ring-gradient" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#8b5cf6" />
                <stop offset="100%" stop-color="#22d3ee" />
              </linearGradient>
            </defs>
            <circle cx="30" cy="30" r="26" fill="none" stroke="rgb(255 255 255 / 0.07)" stroke-width="5" />
            <circle id="progress-ring" cx="30" cy="30" r="26" fill="none" stroke="url(#ring-gradient)" stroke-width="5" stroke-linecap="round" stroke-dasharray="163.36" stroke-dashoffset="163.36" />
          </svg>
          <span id="progress-percent" class="absolute font-display text-sm font-semibold text-zinc-100 sm:text-base">0%</span>
        </div>
      </header>

      <!-- Stats -->
      <dl class="mt-6 grid grid-cols-2 gap-3">
        <div class="rounded-2xl border border-white/[0.06] bg-white/[0.025] px-4 py-3 backdrop-blur">
          <dt class="text-xs font-medium text-zinc-500">In progress</dt>
          <dd id="stat-active" class="mt-0.5 font-display text-2xl font-semibold text-zinc-50">0</dd>
        </div>
        <div class="rounded-2xl border border-white/[0.06] bg-white/[0.025] px-4 py-3 backdrop-blur">
          <dt class="text-xs font-medium text-zinc-500">Completed</dt>
          <dd id="stat-completed" class="mt-0.5 font-display text-2xl font-semibold text-zinc-50">0</dd>
        </div>
      </dl>

      <main class="mt-6">
        <!-- Composer -->
        <form id="composer" class="rounded-2xl border border-white/10 bg-zinc-900/60 p-2 shadow-2xl shadow-violet-950/30 backdrop-blur-xl transition focus-within:border-violet-500/40 focus-within:shadow-violet-900/40" autocomplete="off" novalidate>
          <label for="task-input" class="sr-only">New task</label>
          <input id="task-input" name="title" type="text" maxlength="200" placeholder="What needs your focus?" enterkeyhint="done"
            class="w-full bg-transparent px-3 py-3 text-base text-zinc-50 outline-none placeholder:text-zinc-500" />

          <div class="flex flex-wrap items-center justify-between gap-2 border-t border-white/5 px-1 pt-2">
            <fieldset class="flex items-center gap-1 rounded-xl bg-white/[0.03] p-1">
              <legend class="sr-only">Priority</legend>
              <label class="cursor-pointer">
                <input type="radio" name="priority" value="low" class="peer sr-only" />
                <span class="block rounded-lg px-2.5 py-1 text-xs font-semibold text-zinc-400 transition hover:text-zinc-200 peer-checked:bg-emerald-500/15 peer-checked:text-emerald-300 peer-focus-visible:ring-2 peer-focus-visible:ring-violet-400">Low</span>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="priority" value="medium" class="peer sr-only" checked />
                <span class="block rounded-lg px-2.5 py-1 text-xs font-semibold text-zinc-400 transition hover:text-zinc-200 peer-checked:bg-amber-500/15 peer-checked:text-amber-300 peer-focus-visible:ring-2 peer-focus-visible:ring-violet-400">Medium</span>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="priority" value="high" class="peer sr-only" />
                <span class="block rounded-lg px-2.5 py-1 text-xs font-semibold text-zinc-400 transition hover:text-zinc-200 peer-checked:bg-rose-500/15 peer-checked:text-rose-300 peer-focus-visible:ring-2 peer-focus-visible:ring-violet-400">High</span>
              </label>
            </fieldset>

            <div class="flex items-center gap-2">
              <button id="composer-breakdown" type="button" title="Add and break into 3 steps (Ctrl/⌘ + Enter)"
                class="breakdown-btn inline-flex items-center gap-1.5 rounded-xl border border-transparent px-3 py-2 text-sm font-semibold text-violet-100 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-violet-400">
                <span aria-hidden="true">✨</span> Breakdown
              </button>
              <button type="submit"
                class="inline-flex items-center gap-1.5 rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-lg shadow-violet-900/40 transition hover:from-violet-500 hover:to-indigo-500 active:scale-[0.98] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-violet-300 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950">
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14" /><path d="M12 5v14" /></svg>
                Add task
              </button>
            </div>
          </div>
        </form>

        <!-- Toolbar -->
        <div class="mt-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
          <div class="relative sm:w-64">
            <label for="search-input" class="sr-only">Search tasks</label>
            <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-zinc-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></svg>
            <input id="search-input" type="search" placeholder="Search tasks…" autocomplete="off"
              class="peer w-full rounded-xl border border-white/[0.08] bg-white/[0.03] py-2 pl-9 pr-16 text-sm text-zinc-100 outline-none transition placeholder:text-zinc-500 focus:border-violet-500/50 focus:bg-white/[0.05] focus:ring-4 focus:ring-violet-500/10 [&::-webkit-search-cancel-button]:hidden" />
            <button id="clear-search" type="button" aria-label="Clear search" hidden
              class="absolute right-2 top-1/2 -translate-y-1/2 rounded-md p-1 text-zinc-500 transition hover:text-zinc-200">
              <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
            </button>
            <kbd class="pointer-events-none absolute right-3 top-1/2 hidden -translate-y-1/2 rounded border border-white/10 px-1.5 text-[10px] font-medium text-zinc-500 sm:block peer-[:not(:placeholder-shown)]:hidden">/</kbd>
          </div>

          <div id="filters" role="tablist" aria-label="Filter tasks" class="grid grid-cols-3 gap-1 rounded-xl border border-white/[0.06] bg-white/[0.03] p-1">
            <button type="button" role="tab" data-filter="all" aria-selected="true" aria-controls="task-list"
              class="flex items-center justify-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-semibold text-zinc-400 transition hover:text-zinc-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-violet-400 aria-selected:bg-white/10 aria-selected:text-white aria-selected:shadow">
              All <span data-count class="rounded-full bg-white/10 px-1.5 text-[10px] tabular-nums">0</span>
            </button>
            <button type="button" role="tab" data-filter="active" aria-selected="false" aria-controls="task-list"
              class="flex items-center justify-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-semibold text-zinc-400 transition hover:text-zinc-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-violet-400 aria-selected:bg-white/10 aria-selected:text-white aria-selected:shadow">
              Active <span data-count class="rounded-full bg-white/10 px-1.5 text-[10px] tabular-nums">0</span>
            </button>
            <button type="button" role="tab" data-filter="completed" aria-selected="false" aria-controls="task-list"
              class="flex items-center justify-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-semibold text-zinc-400 transition hover:text-zinc-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-violet-400 aria-selected:bg-white/10 aria-selected:text-white aria-selected:shadow">
              Done <span data-count class="rounded-full bg-white/10 px-1.5 text-[10px] tabular-nums">0</span>
            </button>
          </div>
        </div>

        <!-- List -->
        <section aria-labelledby="tasks-heading" class="mt-4">
          <h2 id="tasks-heading" class="sr-only">Tasks</h2>
          <ul id="task-list" role="tabpanel" class="space-y-2.5" aria-live="polite"></ul>
          <div id="empty-state" class="rounded-2xl border border-dashed border-white/10 px-6 py-14 text-center" hidden></div>
        </section>

        <!-- Footer bar -->
        <div class="mt-5 flex items-center justify-between px-1 text-xs text-zinc-500">
          <span id="items-left">0 tasks left</span>
          <button id="clear-completed" type="button"
            class="rounded-lg px-2 py-1 font-medium transition hover:bg-white/5 hover:text-zinc-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-violet-400 disabled:pointer-events-none disabled:opacity-40">
            Clear completed
          </button>
        </div>
      </main>

      <footer class="mt-auto pt-16 text-center text-xs text-zinc-600">
        <p class="hidden sm:block">
          <kbd class="rounded border border-white/10 px-1.5 py-0.5 text-zinc-400">N</kbd> new task ·
          <kbd class="rounded border border-white/10 px-1.5 py-0.5 text-zinc-400">/</kbd> search ·
          <kbd class="rounded border border-white/10 px-1.5 py-0.5 text-zinc-400">Ctrl/⌘ ↵</kbd> add + breakdown ·
          double-click a task to edit
        </p>
        <p class="mt-2">Focus &amp; Flow · Your tasks stay on this device.</p>
      </footer>
    </div>

    <div id="toast-region" class="pointer-events-none fixed inset-x-0 bottom-4 z-50 flex flex-col items-center gap-2 px-4" aria-live="polite"></div>

    <noscript>
      <div class="fixed inset-x-0 top-0 bg-rose-600 p-3 text-center text-sm font-medium text-white">Focus &amp; Flow needs JavaScript enabled to run.</div>
    </noscript>
  </body>
</html>
